<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Meeoww - Music Player</title>
  <meta http-equiv="refresh" content="0; url=/outputs/music-player/frontend/index.html">
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1c1e34 0%, #0d0f1b 100%);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loader {
      text-align: center;
    }
    .loader h1 {
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ff5e83, #fa3f69);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .dots {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #fa3f69;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-12px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader">
    <h1>🐱 Meeoww</h1>
    <p>Loading Music Player...</p>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
  
  <script>
    // Redirect to the actual app
    setTimeout(() => {
      window.location.href = '/outputs/music-player/frontend/index.html';
    }, 500);
  </script>
</body>
</html>
